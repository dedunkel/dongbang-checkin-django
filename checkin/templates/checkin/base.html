{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}동방배틀 체크인{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'checkin/theme.css' %}" />
  {% block extra_head %}{% endblock %}
  <script>
    (function () {
      // CSS가 칠해지기 전에 저장된 테마부터 적용해서 깜빡임 없이 바로 맞는
      // 테마로 그려지게 한다. 스태프 쪽(admin) 토글과 같은 localStorage 키를
      // 써서, 한쪽에서 바꾸면 다른 쪽도 다음 방문 때 그대로 이어진다.
      try {
        var stored = localStorage.getItem('dbbt-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="theme-toggle" role="group" aria-label="라이트/다크 테마 전환">
    <button type="button" class="theme-toggle-option" data-theme-choice="light" aria-label="라이트 모드">
      <svg width="14" height="14" viewBox="0 0 14 14">
        <circle cx="7" cy="7" r="2.7" stroke-width="1.3"/>
        <path d="M7 0.5V2M7 12V13.5M0.5 7H2M12 7H13.5M2.5 2.5L3.6 3.6M10.4 10.4L11.5 11.5M11.5 2.5L10.4 3.6M3.6 10.4L2.5 11.5" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </button>
    <button type="button" class="theme-toggle-option" data-theme-choice="dark" aria-label="다크 모드">
      <svg width="14" height="14" viewBox="0 0 14 14">
        <path d="M11.5 8.5A5 5 0 1 1 5.5 2.5A4 4 0 0 0 11.5 8.5Z"/>
      </svg>
    </button>
  </div>
  <main>
    {% if messages %}
      <ul class="message-list">
        {% for message in messages %}
          <li class="message-item {% if message.tags == 'success' %}success{% elif message.tags == 'error' %}error{% else %}info{% endif %}">
            {{ message }}
          </li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer>동방배틀 체크인 시스템</footer>
  <script>
    (function () {
      document.querySelectorAll('.theme-toggle-option').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var choice = btn.getAttribute('data-theme-choice');
          document.documentElement.setAttribute('data-theme', choice);
          try { localStorage.setItem('dbbt-theme', choice); } catch (e) {}
        });
      });
    })();
  </script>
</body>
</html>
