{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}동방배틀 체크인{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'checkin/theme.css' %}" />
  {% block extra_head %}{% endblock %}
</head>
<body>
  <main>
    {% if messages %}
      <ul class="message-list">
        {% for message in messages %}
          <li class="message-item {% if message.tags == 'success' %}success{% elif message.tags == 'error' %}error{% else %}info{% endif %}">
            {{ message }}
          </li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer>동방배틀 체크인 시스템 (Django 버전)</footer>
</body>
</html>
