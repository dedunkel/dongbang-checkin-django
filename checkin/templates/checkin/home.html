{% extends "checkin/base.html" %}
{% block title %}동방배틀 체크인 시스템{% endblock %}
{% block content %}
<h1>동방배틀 체크인 시스템</h1>
<div class="card">
  <p class="muted">신청 접수는 기존 구글 폼을 그대로 이용해주세요. 아래는 운영진용 링크입니다.</p>
  <p style="margin-top:1.25rem;">
    <a class="btn" href="/admin/">운영진 대시보드 (/admin)</a>
  </p>
  <p style="margin-top:0.75rem;">
    <a href="{% url 'checkin:checkin' %}">현장 체크인 스캐너 →</a>
  </p>
  <p style="margin-top:0.5rem;">
    <a href="{% url 'checkin:register' %}">예비 신청 폼 (구글 폼 미사용 시) →</a>
  </p>
</div>
{% endblock %}
