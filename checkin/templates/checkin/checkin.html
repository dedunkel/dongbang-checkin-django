{% extends "checkin/base.html" %}
{% load static %}
{% block title %}현장 체크인{% endblock %}
{% block content %}
<div class="topbar">
  <div class="brand">
    <img src="{% static 'checkin/logo.png' %}" alt="로고" />
    <span class="title" style="color:var(--text); letter-spacing:normal;">동방배틀{% if event %} {{ event.name }}{% endif %} 체크인</span>
  </div>
  <span class="pill">관리자 모드</span>
</div>

{% csrf_token %}

<div id="viewfinder" class="viewfinder">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas" style="display:none;"></canvas>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div id="scanLine" class="scan-line"></div>
  <div id="scanResult" class="overlay"></div>
</div>
<div id="cameraOffBox" class="camera-off-box" style="display:none;">
  카메라를 사용할 수 없습니다.<br />아래 수동 검색을 이용해주세요.
</div>
<p id="scanHint" class="muted" style="text-align:center; margin-top:0.85rem;">QR을 화면 사각형 안에 비춰주세요</p>

<div class="divider-row">
  <div class="line"></div>
  <div id="searchDividerLabel" class="label">또는 직접 검색</div>
  <div class="line"></div>
</div>

<div style="margin-top:1.1rem;">
  <label for="searchBox">이름/전화번호로 수동 검색</label>
  <input type="text" id="searchBox" placeholder="이름 또는 전화번호" />
  <div id="searchResults" style="margin-top:0.5rem;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const csrfToken = document.querySelector('input[name=csrfmiddlewaretoken]').value;
const overlay = document.getElementById('scanResult');

// 참가자 이름/학교/장르 등은 신청자가 직접 입력한 값이라, innerHTML에 넣기
// 전에 반드시 이스케이프해야 함 (안 그러면 이름에 스크립트를 넣어 스태프
// 세션에서 실행시키는 스토어드 XSS가 가능해짐).
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function subInfo(p) {
  return [p.entryType, p.genre, p.school].filter(Boolean).map(escapeHtml).join(' · ');
}

function showOverlay(html) {
  overlay.innerHTML = `<div class="result-card">${html}</div>`;
  overlay.classList.add('show');
}

function hideOverlay() {
  overlay.classList.remove('show');
  overlay.innerHTML = '';
}

function foundCardHtml(p) {
  const code = p.labelCode ? `<div class="code">${escapeHtml(p.labelCode)}</div>` : '';
  const already = p.checkinStatus === 'CHECKED_IN';
  return `
    ${code}
    <div class="name">${escapeHtml(p.name)}</div>
    <div class="sub">${subInfo(p)}</div>
    ${already
      ? '<div class="status bad">이미 체크인됨</div>'
      : `<button data-id="${escapeHtml(p.id)}" id="confirmCheckinBtn">체크인 확정</button>`}
  `;
}

function checkedInCardHtml(p) {
  const code = p.labelCode ? `<div class="code">${escapeHtml(p.labelCode)}</div>` : '';
  return `
    <svg class="check-icon" width="34" height="34" viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="23" fill="var(--ok-soft)" stroke="var(--ok)" stroke-width="2.5"/>
      <path d="M16 27 L23 34 L37 18" fill="none" stroke="var(--ok)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    ${code}
    <div class="name">${escapeHtml(p.name)}</div>
    <div class="sub">${subInfo(p)}</div>
    <div class="status ok">체크인 완료</div>
  `;
}

// 로그인 세션이 만료되면 @staff_member_required가 이 API 요청들을 로그인
// 페이지(HTML)로 리다이렉트시키는데, fetch()는 기본적으로 그 리다이렉트를
// 따라가 최종 응답(HTML, 200)을 그대로 돌려준다. 그 상태에서 res.json()을
// 부르면 처리되지 않은 예외가 나서 화면에 아무 안내도 없이 조용히 실패하고
// (행사 중 스태프는 체크인이 된 줄 알고 다음 사람으로 넘어갈 위험), 실제로는
// 참가자가 체크인되지 않은 채 남는다. content-type으로 먼저 걸러내 명확한
// 안내를 보여준다.
async function apiFetchJson(url, options) {
  let res;
  try {
    res = await fetch(url, options);
  } catch (e) {
    showOverlay('<div class="status bad">네트워크 오류로 요청에 실패했습니다. 다시 시도해주세요.</div>');
    return null;
  }
  if (!(res.headers.get('content-type') || '').includes('application/json')) {
    showOverlay('<div class="status bad">로그인이 만료됐습니다.<br/>새로고침 후 다시 로그인해주세요.</div>');
    return null;
  }
  return res.json();
}

async function lookupQr(text) {
  const data = await apiFetchJson('{% url "checkin:qr_lookup_api" %}', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
    body: JSON.stringify({ text }),
  });
  if (!data) return;
  if (data.status !== 'FOUND') {
    showOverlay('<div class="status bad">등록되지 않은 QR입니다.</div>');
    return;
  }
  showOverlay(foundCardHtml(data.data));
}

overlay.addEventListener('click', async (e) => {
  if (e.target.id !== 'confirmCheckinBtn') return;
  const id = e.target.dataset.id;
  const data = await apiFetchJson(`/api/participants/${id}/manual-checkin/`, {
    method: 'POST', headers: { 'X-CSRFToken': csrfToken },
  });
  if (!data) return;
  showOverlay(checkedInCardHtml(data.data));
});

// --- 카메라 QR 스캔 ---
let lastText = '';
let lastAt = 0;
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;
    requestAnimationFrame(tick);
  } catch (e) {
    document.getElementById('viewfinder').style.display = 'none';
    document.getElementById('cameraOffBox').style.display = 'flex';
    document.getElementById('scanHint').style.display = 'none';
    document.getElementById('searchDividerLabel').textContent = '수동 검색';
  }
}

function tick() {
  if (typeof jsQR !== 'function') {
    showOverlay('<div class="status bad">QR 인식 라이브러리를 불러오지 못했습니다.<br/>페이지를 새로고침해주세요.</div>');
    return;
  }
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height);
    if (code && code.data) {
      const now = Date.now();
      if (code.data !== lastText || now - lastAt > 3000) {
        lastText = code.data;
        lastAt = now;
        lookupQr(code.data);
      }
    } else if (overlay.classList.contains('show') && Date.now() - lastAt > 4000) {
      hideOverlay();
    }
  }
  requestAnimationFrame(tick);
}
startCamera();

// --- 수동 검색 ---
const searchBox = document.getElementById('searchBox');
const searchResults = document.getElementById('searchResults');
let searchTimer = null;

searchBox.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = searchBox.value.trim();
  if (!q) { searchResults.innerHTML = ''; return; }
  searchTimer = setTimeout(async () => {
    const data = await apiFetchJson(`{% url "checkin:participant_search_api" %}?q=${encodeURIComponent(q)}`);
    if (!data) return;
    searchResults.innerHTML = data.results.map(p => `
      <div class="search-item">
        <span>${escapeHtml(p.name)} · ${escapeHtml(p.phone)}${p.entryType ? ' · ' + escapeHtml(p.entryType) : ''}${p.genre ? ' · ' + escapeHtml(p.genre) : ''}${p.labelCode ? ' · ' + escapeHtml(p.labelCode) : ''}</span>
        ${p.checkinStatus === 'CHECKED_IN'
          ? '<span class="muted">체크인됨</span>'
          : `<button data-id="${escapeHtml(p.id)}" class="manualBtn btn-outline">체크인</button>`}
      </div>
    `).join('') || '<p class="muted">검색 결과가 없습니다.</p>';
  }, 250);
});

searchResults.addEventListener('click', async (e) => {
  if (!e.target.classList.contains('manualBtn')) return;
  const id = e.target.dataset.id;
  const data = await apiFetchJson(`/api/participants/${id}/manual-checkin/`, {
    method: 'POST', headers: { 'X-CSRFToken': csrfToken },
  });
  if (!data) return;
  searchBox.dispatchEvent(new Event('input'));
});
</script>
{% endblock %}
