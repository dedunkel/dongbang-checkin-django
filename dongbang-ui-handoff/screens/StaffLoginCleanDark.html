<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
:root{
  --bg: oklch(15% 0.006 60);
  --surface: oklch(20% 0.008 60);
  --line: oklch(31% 0.012 60);
  --text: oklch(96% 0.004 90);
  --muted: oklch(66% 0.016 60);
  --accent: oklch(74% 0.12 260);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif;}
.field-label{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px;text-align:left;}
.field-input{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:11px 12px;font-size:13px;color:var(--muted);text-align:left;}
</style>
</helmet>
<div style="width:390px;height:900px;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;">
  <div style="width:300px;">

    <div style="display:flex;align-items:center;justify-content:center;gap:8px;">
      <img src="logo.png" alt="KOOKMIN UNIV DANCE CREW" style="height:13px;width:auto;"/>
      <div style="font-size:11px;letter-spacing:0.16em;color:var(--muted);font-weight:700;">DBBT STAFF</div>
    </div>

    <div style="text-align:center;margin-top:22px;">
      <div style="font-size:19px;font-weight:900;">스태프 로그인</div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.6;">현장 체크인 스캐너와 운영진 대시보드는<br/>스태프 계정으로만 접근할 수 있어요</div>
    </div>

    <div style="margin-top:28px;">
      <div class="field-label">아이디</div>
      <div class="field-input">아이디 입력</div>
    </div>
    <div style="margin-top:16px;">
      <div class="field-label">비밀번호</div>
      <div class="field-input">비밀번호 입력</div>
    </div>

    <div style="margin-top:22px;padding:13px 0;background:var(--accent);color:oklch(15% 0.006 60);font-weight:700;font-size:15px;border-radius:4px;text-align:center;">
      로그인
    </div>

    <div style="margin-top:16px;font-size:10.5px;line-height:1.6;color:var(--muted);text-align:center;">
      기기당 최초 1회만 로그인하면 됩니다.<br/>계정이 없다면 슈퍼유저에게 계정 초대를 요청해주세요.
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
