<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>

<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
:root{
  --bg: oklch(15% 0.006 60);
  --surface: oklch(20% 0.008 60);
  --line: oklch(31% 0.012 60);
  --text: oklch(96% 0.004 90);
  --muted: oklch(66% 0.016 60);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif;}
</style>
</helmet>
<div style="width:390px;height:900px;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;">
  <div style="width:300px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 18px oklch(0% 0 0 / 0.35);padding:36px 28px;text-align:center;">
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;">
      <img src="logo.png" alt="KOOKMIN UNIV DANCE CREW" style="height:13px;width:auto;"/>
      <div style="font-size:11px;letter-spacing:0.16em;color:var(--muted);font-weight:700;">동방배틀 VOL.33 체크인</div>
    </div>
    <div style="font-size:14px;color:var(--muted);margin-top:18px;line-height:1.7;">등록되지 않은 QR입니다.</div>
  </div>
</div>
</x-dc>
</body>
</html>
