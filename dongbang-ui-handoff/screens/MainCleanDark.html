<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
:root{
  --bg: oklch(15% 0.006 60);
  --surface: oklch(20% 0.008 60);
  --line: oklch(31% 0.012 60);
  --text: oklch(96% 0.004 90);
  --muted: oklch(66% 0.016 60);
  --accent: oklch(74% 0.12 260);
  --accent-soft: oklch(27% 0.05 260);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif;}
</style>
</helmet>
<div style="width:390px;height:900px;background:var(--bg);position:relative;overflow:hidden;">

  <div style="padding:80px 28px 0;display:flex;flex-direction:column;align-items:flex-start;">
    <img src="logo.png" alt="KOOKMIN UNIV DANCE CREW" style="width:120px;height:auto;"/>

    <h1 style="font-family:'Noto Sans KR',sans-serif;font-weight:900;font-size:38px;line-height:1.15;margin:22px 0 0;color:var(--text);">
      동방배틀
    </h1>

    <div style="margin-top:16px;display:flex;align-items:center;gap:10px;">
      <span style="font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:5px 11px;border-radius:2px;">VOL.33</span>
      <span style="font-size:13px;color:var(--muted);font-weight:500;">2026.10.04 · 국민대학교</span>
    </div>

    <div style="margin-top:32px;width:100%;height:1px;background:var(--line);"></div>

    <p style="margin-top:22px;font-size:13.5px;line-height:1.7;color:var(--muted);">
      신청 접수는 기존 구글 폼을 그대로 이용해주세요.<br/>아래는 운영진용 링크입니다.
    </p>

    <div style="margin-top:28px;width:100%;display:flex;flex-direction:column;">

      <div style="border-top:1px solid var(--line);padding:18px 2px;display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div style="font-size:10.5px;letter-spacing:0.1em;color:var(--muted);font-weight:700;">STAFF</div>
          <div style="font-size:16px;font-weight:700;margin-top:4px;color:var(--text);">현장 체크인 스캐너</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M6 3L11 8L6 13" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div style="border-top:1px solid var(--line);padding:18px 2px;display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div style="font-size:10.5px;letter-spacing:0.1em;color:var(--muted);font-weight:700;">STAFF</div>
          <div style="font-size:16px;font-weight:700;margin-top:4px;color:var(--text);">운영진 대시보드</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M6 3L11 8L6 13" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div style="border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 14px;display:flex;justify-content:space-between;align-items:center;background:var(--accent-soft);margin:0 -2px;">
        <div>
          <div style="font-size:10.5px;letter-spacing:0.1em;color:var(--accent);font-weight:700;">참가자</div>
          <div style="font-size:16px;font-weight:700;margin-top:4px;color:var(--text);">예비 신청 폼</div>
          <div style="font-size:10.5px;color:var(--muted);margin-top:2px;">구글 폼 미사용 시</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M6 3L11 8L6 13" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

    </div>
  </div>

  <div style="position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);letter-spacing:0.02em;">
    동방배틀 체크인 시스템
  </div>
</div>
</x-dc>
</body>
</html>
