<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
:root{
  --bg: oklch(15% 0.006 60);
  --surface: oklch(20% 0.008 60);
  --surface2: oklch(24% 0.01 60);
  --line: oklch(31% 0.012 60);
  --text: oklch(96% 0.004 90);
  --muted: oklch(66% 0.016 60);
  --accent: oklch(74% 0.12 260);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif;}
.section{border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-top:14px;}
.section-title{font-size:12.5px;font-weight:900;color:var(--text);margin-bottom:14px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;}
.field-label{font-size:10.5px;color:var(--muted);font-weight:700;margin-bottom:5px;}
.field-input{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:9px 11px;font-size:12.5px;color:var(--text);display:flex;align-items:center;justify-content:space-between;}
.field-input.placeholder{color:var(--muted);}
.field-help{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.5;}
.toggle{width:34px;height:19px;border-radius:10px;background:var(--line);position:relative;flex-shrink:0;}
.toggle-dot{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:white;}
.btn{padding:10px 16px;border-radius:4px;font-size:12.5px;font-weight:700;white-space:nowrap;}
.btn-primary{background:var(--accent);color:oklch(15% 0.006 60);}
.btn-outline{background:var(--surface);border:1px solid var(--line);color:var(--text);}
</style>
</helmet>
<div style="width:1280px;height:760px;background:var(--bg);padding:30px 36px 50px;overflow:hidden;">

  <!-- top bar -->
  <div style="display:flex;justify-content:space-between;align-items:flex-start;">
    <div>
      <div style="display:flex;align-items:center;gap:8px;">
        <img src="logo.png" alt="KOOKMIN UNIV DANCE CREW" style="height:13px;width:auto;"/>
        <div style="font-size:10.5px;letter-spacing:0.16em;color:var(--muted);font-weight:700;">DBBT STAFF</div>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:6px;">회차 관리 <span style="margin:0 4px;">›</span> 새 회차 추가</div>
      <h1 style="font-size:22px;font-weight:900;margin:4px 0 0;">새 회차 추가</h1>
    </div>
    <div style="font-size:12px;color:var(--muted);">staff@dongbangbattle.kr</div>
  </div>

  <div class="section">
    <div class="section-title">기본 정보</div>
    <div class="grid2">
      <div><div class="field-label">회차 번호</div><div class="field-input placeholder">예: 34</div></div>
      <div><div class="field-label">회차 이름</div><div class="field-input placeholder">예: 동방배틀 vol.34</div></div>
      <div>
        <div class="field-label">신규 신청 활성화</div>
        <div class="field-input"><span style="color:var(--muted);">끔 — 저장 후 필요할 때 켜세요</span><div class="toggle"><div class="toggle-dot"></div></div></div>
        <div class="field-help">켜면 기존에 활성화되어 있던 회차는 자동으로 비활성화됩니다.</div>
      </div>
      <div>
        <div class="field-label">점수 시트 연동 URL <span style="font-weight:400;">(선택)</span></div>
        <div class="field-input placeholder">SheetSync.gs 웹 앱 URL</div>
        <div class="field-help">비워두면 나중에 회차 상세에서 추가할 수 있어요.</div>
      </div>
    </div>
  </div>

  <div style="margin-top:22px;display:flex;align-items:center;gap:8px;">
    <div class="btn btn-primary">저장</div>
    <div class="btn btn-outline">저장 후 계속 편집</div>
    <div class="btn btn-outline">저장 후 새로 추가</div>
    <div style="font-size:12.5px;color:var(--muted);margin-left:6px;">목록으로</div>
  </div>

</div>
</x-dc>
</body>
</html>
